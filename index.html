<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121b21">
<meta name="color-scheme" content="dark">
<title>日本のご家庭ガチャ｜出生地プロトタイプ</title>
<style>
:root { --bg:#10191f; --surface:#1b2930; --surface2:#23343c; --line:#354750; --text:#f4f2ec; --muted:#b2bfc5; --accent:#d6b77b; --accent2:#aec2c8; --ok:#91d3b2; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; }
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 80% 0%,#20333b 0,transparent 380px),var(--bg);color:var(--text);min-height:100dvh;line-height:1.55}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}main{max-width:760px;margin:0 auto;padding:20px 16px calc(38px + env(safe-area-inset-bottom))}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 20px}.eyebrow{letter-spacing:.17em;font-size:10px;font-weight:800;color:var(--accent)}h1{font-size:clamp(24px,6vw,32px);line-height:1.3;margin:5px 0 0;letter-spacing:.02em}.version{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 9px;flex-shrink:0}.hero{border:1px solid #4b5653;background:linear-gradient(150deg,#263943,#18252d 70%);border-radius:22px;padding:24px 20px 20px;box-shadow:0 16px 36px #0002}.hero-kicker{font-size:12px;color:var(--muted)}.hero-content{text-align:center;padding:20px 4px 22px}.symbol{width:70px;height:70px;border-radius:23px;border:1px solid #67736f;display:grid;place-items:center;margin:0 auto 18px;background:#263c43;font-size:32px}.place{font-size:clamp(24px,6vw,36px);line-height:1.38;margin:0;letter-spacing:.03em}.small{color:var(--muted);font-size:12px;margin:7px 0 0}.primary{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:#172026;font-size:16px;font-weight:800}.primary:active{transform:translateY(1px);filter:brightness(.96)}.pill{display:inline-flex;align-items:center;gap:5px;background:#142029b0;border-radius:999px;padding:5px 11px;color:var(--accent2);font-size:11px}.block{margin-top:24px}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}h2{font-size:18px;margin:0}h3{font-size:13px;color:var(--accent);margin:0 0 12px}.subtext{font-size:11px;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0c1419;padding:5px;border:1px solid var(--line);border-radius:14px}.tab{background:transparent;color:var(--muted);border:0;border-radius:10px;padding:11px 2px;font-size:13px;font-weight:700;min-height:44px}.tab.active{background:var(--surface2);color:var(--text)}.stat-panel{padding-top:12px}.stat-card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;margin-bottom:10px}.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{border:1px solid #304149;background:var(--surface2);border-radius:10px;min-height:69px;padding:11px 10px}.stat .name{font-size:11px;color:var(--muted);margin-bottom:5px}.stat .value{font-size:16px;font-weight:750;word-break:break-word}.empty{color:#8fa0a8}.note{padding:12px 14px;border-left:3px solid var(--accent);color:var(--muted);font-size:12px;background:#1c2a31;border-radius:0 10px 10px 0}.tool-box{border:1px solid var(--line);background:var(--surface);padding:16px;border-radius:16px}.test-controls{display:flex;gap:9px;align-items:center}.test-controls select{min-width:0;flex:1;background:var(--surface2);color:var(--text);border:1px solid #52626a;border-radius:10px;padding:11px;font:inherit;font-size:14px;min-height:44px}.secondary{background:#314851;color:var(--text);border:1px solid #52626a;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:700;font-size:13px}.secondary:disabled{opacity:.45;cursor:default}.results{margin-top:18px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 14px}.metric{background:#243640;border-radius:12px;padding:11px}.metric b{font-size:21px;display:block;font-variant-numeric:tabular-nums}.metric span{font-size:11px;color:var(--muted)}.result-list{max-height:520px;overflow:auto;overscroll-behavior:contain;border:1px solid #344750;border-radius:12px}.result-head,.result-row{display:grid;grid-template-columns:minmax(86px,1fr) 70px 70px;gap:5px;align-items:center;padding:9px 12px;font-size:12px;border-bottom:1px solid #31424a}.result-head{position:sticky;top:0;background:#32454d;color:#e4eaf0;font-weight:700;z-index:1}.result-row{min-height:44px}.result-row:last-child{border-bottom:0}.right{text-align:right;font-variant-numeric:tabular-nums}.bar{height:3px;background:#a8bcc2;border-radius:5px;max-width:100%;margin-top:4px;opacity:.5}.detail{font-size:11px;color:var(--muted);margin-top:10px}.foot{color:#83969f;font-size:11px;line-height:1.65;margin:26px 0 10px}a{color:var(--accent)}.status-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #33434b;font-size:12px}.status-row:last-child{border-bottom:0}.ready{color:var(--ok)}.pending{color:var(--muted)}@media(min-width:650px){main{padding-top:28px}.hero{padding:30px}.stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:360px){.stat-grid{gap:6px}.stat{padding:9px}.result-head,.result-row{grid-template-columns:minmax(70px,1fr) 65px 65px;padding-left:8px;padding-right:8px}}

</style>
</head>
<body><main>
<header class="topline"><div><div class="eyebrow">LIFE SIMULATION / PROTOTYPE</div><h1>日本のご家庭ガチャ</h1></div><span class="version">v0.12.1 ブラウザ版</span></header>
<section class="hero" aria-live="polite"><div class="hero-content"><div class="symbol" aria-hidden="true">🎲</div><h2 class="place" id="birthPlace">まだ生まれていません</h2></div><button class="primary" id="rollBtn">出生地を抽選する</button></section>
<section class="block"><div class="heading"><h2>ステータス</h2><span class="subtext">配置確認用・未抽選</span></div><nav class="tabs" aria-label="ステータス分類"><button class="tab active" type="button" data-tab="person" aria-pressed="true">本人</button><button class="tab" type="button" data-tab="family" aria-pressed="false">家庭</button><button class="tab" type="button" data-tab="environment" aria-pressed="false">環境</button></nav><div id="statPanel" class="stat-panel"></div></section>
<section class="block"><div class="heading"><h2>実装状況</h2><span class="subtext">開発メモ</span></div><div class="tool-box"><div class="status-row"><span>生まれる都道府県</span><b class="ready">動作中</b></div><div class="status-row"><span>生まれる市区町村</span><b class="ready">動作中</b></div><div class="status-row"><span>性別</span><b class="ready">動作中</b></div><div class="status-row"><span>母親の年齢</span><b class="ready">動作中</b></div><div class="status-row"><span>両親の関係</span><b class="ready">動作中</b></div><div class="status-row"><span>父親の年齢（既婚時）</span><b class="ready">動作中</b></div><div class="status-row"><span>その他の親・本人のパラメータ抽選</span><b class="pending">未実装</b></div><div class="status-row"><span>0〜5歳の自動進行</span><b class="pending">未実装</b></div></div></section>

</main>
<script src="data/prefectures_2025.js"></script>
<script src="data/municipalities_2025.js"></script>
<script src="data/sex_probabilities_2025.js"></script>
<script src="data/parent_age_joint_probabilities_2025.js?v=0.12.1"></script>
<script src="data/parent_relationship_probabilities_2025.js?v=0.12.0"></script>
<script>
 'use strict';


function pickPrefecture() {
    const random = Math.random();
    for (let i = 0; i < PREFS.length; i++) {
        if (random < PREFS[i][2]) {
            return PREFS[i][0];
        }
    }
    throw new Error('都道府県の抽選に失敗しました。累積確率を確認してください。');
}

function pickMunicipality(prefecture) {
    const municipalities = CITIES[prefecture];
    if (!municipalities) {
        throw new Error('市区町村のデータが見つかりません: ' + prefecture);
    }
    const random = Math.random();
    for (let i = 0; i < municipalities.length; i++) {
        if (random < municipalities[i][3]) {
            return municipalities[i];
        }
    }
    throw new Error('市区町村の抽選に失敗しました: ' + prefecture);
}

function pickSex(municipality) {
    const maleProbability = SEX_MALE_PROB_2025[municipality[0]];
    if (typeof maleProbability !== 'number') {
        throw new Error('男女出生確率が見つかりません: ' + municipality[0]);
    }
    return Math.random() < maleProbability ? '男' : '女';
}

function pickParentAges() {
    const random = Math.random();
    for (const [motherAge, fatherAge, cumulative] of PARENT_AGES_JOINT_CUMULATIVE_2025) {
        if (random < cumulative) return {motherAge, fatherAge};
    }
    throw new Error('父母の年齢の同時抽選に失敗しました。累積確率を確認してください。');
}

function pickParentsRelationship(motherAge) {
    const marriedProbability = PARENTS_MARRIED_CUMULATIVE_2025[motherAge];
    if (typeof marriedProbability !== 'number') {
        throw new Error('両親の関係の抽選確率が見つかりません: 母親' + motherAge + '歳');
    }
    return Math.random() < marriedProbability ? '既婚' : '未婚';
}

const GROUPS={
 person:[['基本情報',['年齢','性別','健康状態','先天的な体質','持病・障害']],['心と生活',['元気','楽しさ','ストレス','自己肯定感','興味・関心']],['能力・適性',['学力','運動能力','創造性','コミュニケーション','集中力','学習適性（内部）','運動適性（内部）']],['経験',['勉強経験','運動経験','外遊び経験','ゲーム経験','創作経験','その他の経験']]],
 family:[['家族構成',['両親の関係','母親の年齢','父親の年齢','母親との同居','父親との同居','きょうだい','祖父母などの同居']],['経済・生活',['世帯年収','世帯貯蓄','生活費','住居','親の就業状態','育児に使える時間']],['親の特徴',['親の学歴','教育熱心度','情報収集力','意思の尊重度','養育への関与度','しつけ方針']],['家庭内の関係',['親子関係','家庭の安心感','保護者間の関係','家庭内のストレス']]],
 environment:[['居住・地域',['都道府県','市区町村','住環境','地域の安全性','遊び場へのアクセス','学校へのアクセス','公共交通']],['学校・社会',['所属する学校','学校風土','担任との関係','友人数','親しい友人','いじめの状況','学校外の居場所']],['イベント・内部管理',['今年の行動方針','本人が知っている情報','開放済み選択肢','親による強制イベント','進路フラグ','イベント履歴','乱数シード']]]
};

let activeTab = 'person';
let currentPref = null;
let currentCity = null;
let currentSex = null;
let currentMotherAge = null;
let currentParentsRelationship = null;
let currentFatherAge = null;

const $ = id => document.getElementById(id);

function renderStats() {
    const panel = $('statPanel');
    panel.replaceChildren();
    for (const [groupTitle,fields] of GROUPS[activeTab]) {
        const card = document.createElement('section');
        card.className = 'stat-card';
        const heading = document.createElement('h3');
        heading.textContent = groupTitle;
        card.append(heading);
        const grid = document.createElement('div');
        grid.className = 'stat-grid';
        for (const field of fields) {
            const stat = document.createElement('div');
            stat.className = 'stat';
            const label = document.createElement('div');
            label.className = 'name';
            label.textContent = field;
            const value = document.createElement('div');
            value.className = 'value';
            let display = '—';
            if (field === '年齢' && currentPref && currentCity) display = '0歳';
            if (field === '性別' && currentSex) display = currentSex;
            if (field === '母親の年齢' && currentMotherAge !== null) display = currentMotherAge+'歳';
            if (field === '両親の関係' && currentParentsRelationship !== null) display = currentParentsRelationship;
            if (field === '父親の年齢' && currentParentsRelationship !== null) {
                display = currentParentsRelationship === '未婚' ? '不明' : currentFatherAge+'歳';
            }
            if (field === '都道府県' && currentPref) display = currentPref;
            if (field === '市区町村' && currentCity) display = currentCity[1];
            value.textContent = display;
            if (display === '—') value.classList.add('empty');
            stat.append(label,value);
            grid.append(stat);
        }
        card.append(grid);
        panel.append(card);
    }
}

document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{
    activeTab=button.dataset.tab;
    document.querySelectorAll('.tab').forEach(b=>{
        const selected=b===button;
        b.classList.toggle('active',selected);
        b.setAttribute('aria-pressed',String(selected));
    });
    renderStats();
}));

$('rollBtn').addEventListener('click',()=>{
    currentPref = pickPrefecture();
    currentCity = pickMunicipality(currentPref);
    currentSex = pickSex(currentCity);
    const parents = pickParentAges();
    currentMotherAge = parents.motherAge;
    currentFatherAge = parents.fatherAge;
    currentParentsRelationship = pickParentsRelationship(currentMotherAge);
    // 未婚の場合は父親年齢の実測根拠がないため、画面では「不明」と表示する。
    $('birthPlace').textContent = currentPref+currentCity[1]+'に生まれました';
    $('rollBtn').textContent = 'もう一度抽選する';
    renderStats();
});

renderStats();

</script>
</body></html>
